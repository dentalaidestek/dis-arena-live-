name: Arena visual acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-visual-acceptance
          path: |
            test-results
            playwright-report
          retention-days: 7
